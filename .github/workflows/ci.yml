name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
          # The peer ranges say >=4, so one leg runs the 4.x majors.
          - os: ubuntu-latest
            node: 22
            peers: v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.peers == 'v4'
        run: npm install --no-save express@4 fastify@4
      - name: Report node:sqlite availability
        run: |
          node -p "'node:sqlite available ' + Boolean(process.getBuiltinModule?.('node:sqlite'))"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npm run check:package
